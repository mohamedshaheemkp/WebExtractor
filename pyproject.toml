[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webextractor"
version = "1.0.0"
description = "A powerful tool to extract assets and resources from websites and HAR logs."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "rich",
    "beautifulsoup4",
    "lxml",
    "playwright",
    "aiohttp",
    "aiofiles",
    "pydantic",
]

[project.scripts]
webextractor = "webextractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.black]
line-length = 88
